[package]
name = "shap-rs"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Native Rust implementations of model-agnostic, linear, and TreeSHAP explainers"
license = "MIT"
readme = "README.md"
documentation = "https://docs.rs/shap-rs"
repository = "https://github.com/mi7plus/shap-rs"
homepage = "https://github.com/mi7plus/shap-rs"
keywords = ["shap", "explainable-ai", "machine-learning", "shapley"]
categories = ["algorithms", "science"]

[lib]
name = "shap_rs"
path = "src/lib.rs"

[dependencies]
ndarray = { version = "0.16", features = ["serde"] }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", optional = true }
rayon = { version = "1.10", optional = true }
burn-core = { version = "=0.15.0", optional = true, default-features = false, features = ["std", "autodiff"] }
burn-ndarray = { version = "=0.15.0", optional = true, default-features = false }
indexmap = { version = "=2.7.1", optional = true }
rmp-serde = { version = "=1.3.0", optional = true }
rmp = { version = "=0.8.14", optional = true }
uuid = { version = "=1.11.0", optional = true }
proc-macro-crate = { version = "=3.2.0", optional = true }
bincode = { version = "=2.0.0-rc.3", optional = true }
bincode_derive = { version = "=2.0.0-rc.3", optional = true }
half = { version = "=2.4.1", optional = true }

[dev-dependencies]
criterion = "0.5"
clap = "=4.5.23"
proptest = "=1.6.0"
roxmltree = "0.20"
tempfile = "=3.17.1"

[features]
default = []
json-adapters = ["dep:serde_json"]
parallel = ["dep:rayon"]
burn-adapter = ["dep:burn-core", "dep:burn-ndarray", "dep:indexmap", "dep:rmp-serde", "dep:rmp", "dep:uuid", "dep:proc-macro-crate", "dep:bincode", "dep:bincode_derive", "dep:half"]

[[example]]
name = "parallel"
required-features = ["parallel"]

[[bench]]
name = "core"
harness = false
required-features = ["json-adapters", "parallel"]
